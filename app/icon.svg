<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8FB"/>
      <stop offset="100%" stop-color="#F2EAF8"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#B88DE0"/>
      <stop offset="50%" stop-color="#9B70C7"/>
      <stop offset="100%" stop-color="#7B3E98"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7A8C8"/>
      <stop offset="100%" stop-color="#E988AA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A1E5C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Circular background badge with border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#C9A5E8" stroke-width="2.5" />
  
  <!-- Outer Bloom Aura -->
  <path d="M32 50c0 0-16-12-16-24a16 16 0 0 1 32 0c0 12-16 24-16 24z" fill="#9B70C7" opacity="0.18" />

  <!-- Main Blooming Lotus Petal with Shadow -->
  <path d="M32 15 C21 24, 17 35, 32 48 C47 35, 43 24, 32 15z" fill="url(#petalGrad)" filter="url(#shadow)" />

  <!-- Inner delicate blush pink accent curve -->
  <path d="M21 27 Q32 18, 43 27" stroke="url(#pinkGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Central Sparkle -->
  <circle cx="32" cy="31" r="2.8" fill="#FFFFFF" opacity="0.95" />
</svg>